[project]
name = "atlas-support-agent"
version = "0.1.0"
description = "Atlas: AI customer support agent built from primitives (RAG, tools, guardrails, evals)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy[asyncio]>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "pgvector>=0.3",
    "anthropic>=0.40",
    "openai>=1.50",
    "httpx>=0.27",
    "tiktoken>=0.8",
    "langdetect>=1.0.9",
    "numpy>=2.0",
    "pypdf>=5.0",
    "argon2-cffi>=23.1",
    "pyyaml>=6.0",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp-proto-http>=1.27",
    "httpx2>=2.16",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=1.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML",
    "matplotlib>=3.9",
    "reportlab>=4.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["api", "evals"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["web", ".orchestrate", ".specs"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
"api/db/migrations/**" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["api", "evals", "demos", "scripts"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["langdetect.*", "pgvector.*", "reportlab.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --junitxml=reports/junit.xml"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = ["integration: needs the Postgres from `docker compose up -d db`"]
