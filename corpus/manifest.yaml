# Assinaflow support corpus (fictional company; TASK-040, RAG-02, RAG-14).
#
# One entry per doc_key. Every document exists in English and Portuguese with the same facts.
# Paths are relative to this directory:
#   source: the Markdown file that is written by hand (en/<doc_key>.md, pt/<doc_key>.md)
#   file:   the file that ingestion reads. For `format: md` it is the source itself; for
#           `format: pdf` it is the PDF generated from the source by
#           scripts/build_corpus_pdfs.py (pdf/<language>/<doc_key>.pdf, versioned).
# `malicious: true` marks the prompt-injection document that the phase 10 ingestion scan
# must quarantine (GRD-03). Phase 03 ingests it like any other document.
version: 1

# Synonym pairs that keyword search cannot bridge (RAG-05, RAG-16). Only `end-subscription`
# talks about ending a subscription, and it never uses the words "cancel" or "plan".
synonyms:
  - en: ["cancel plan", "end subscription"]
    pt: ["cancelar plano", "encerrar assinatura"]

documents:
  - doc_key: getting-started
    doc_type: manual
    format: md
    languages: [en, pt]
    malicious: false
    title:
      en: "Getting started with Assinaflow"
      pt: "Primeiros passos com a Assinaflow"
    source:
      en: en/getting-started.md
      pt: pt/getting-started.md
    file:
      en: en/getting-started.md
      pt: pt/getting-started.md
