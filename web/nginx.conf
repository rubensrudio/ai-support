# Served as /etc/nginx/conf.d/default.conf in the web image.
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # `/api/chat` -> `http://api:8000/chat`: the trailing slash on proxy_pass strips `/api`.
    location /api/ {
        proxy_pass http://api:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Server-sent events (streaming) must reach the browser unbuffered.
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    # SPA fallback: unknown paths are Angular routes.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
