<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" role="img" aria-labelledby="title desc" font-family="Helvetica, Arial, sans-serif">
  <title id="title">Atlas architecture</title>
  <desc id="desc">The Angular web app calls the FastAPI API through /api. The API stores data and vectors in PostgreSQL with pgvector, calls Anthropic as the primary LLM with OpenAI as fallback and for embeddings, and exports OpenTelemetry traces to Langfuse.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="arrow-dash" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b45309"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="470" rx="12" fill="#ffffff"/>

  <!-- Browser / web -->
  <rect x="24" y="150" width="200" height="150" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="124" y="180" text-anchor="middle" font-size="17" font-weight="bold" fill="#1e3a8a">Web (Angular)</text>
  <text x="124" y="206" text-anchor="middle" font-size="13" fill="#1e293b">login, chat, confirmations</text>
  <text x="124" y="226" text-anchor="middle" font-size="13" fill="#1e293b">SSE token stream</text>
  <text x="124" y="252" text-anchor="middle" font-size="12" fill="#475569">nginx locally,</text>
  <text x="124" y="270" text-anchor="middle" font-size="12" fill="#475569">Render static site in the demo</text>

  <!-- API -->
  <rect x="300" y="60" width="330" height="330" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="465" y="90" text-anchor="middle" font-size="17" font-weight="bold" fill="#14532d">API (FastAPI, Python 3.12)</text>
  <g font-size="13" fill="#1e293b">
    <rect x="320" y="106" width="290" height="34" rx="6" fill="#ffffff" stroke="#86efac"/>
    <text x="465" y="128" text-anchor="middle">guardrails: input, documents, output</text>
    <rect x="320" y="148" width="290" height="34" rx="6" fill="#ffffff" stroke="#86efac"/>
    <text x="465" y="170" text-anchor="middle">context window + hybrid retrieval (RAG)</text>
    <rect x="320" y="190" width="290" height="34" rx="6" fill="#ffffff" stroke="#86efac"/>
    <text x="465" y="212" text-anchor="middle">agent loop + tools with confirmation</text>
    <rect x="320" y="232" width="290" height="34" rx="6" fill="#ffffff" stroke="#86efac"/>
    <text x="465" y="254" text-anchor="middle">structured triage, streaming, prompt cache</text>
    <rect x="320" y="274" width="290" height="34" rx="6" fill="#ffffff" stroke="#86efac"/>
    <text x="465" y="296" text-anchor="middle">LLMClient: retry, circuit breaker, fallback</text>
    <rect x="320" y="316" width="290" height="34" rx="6" fill="#ffffff" stroke="#86efac"/>
    <text x="465" y="338" text-anchor="middle">rate limit, spend cap, daily maintenance</text>
  </g>
  <text x="465" y="376" text-anchor="middle" font-size="12" fill="#475569">OpenTelemetry spans on every request</text>

  <!-- Postgres -->
  <rect x="706" y="300" width="230" height="110" rx="10" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
  <text x="821" y="330" text-anchor="middle" font-size="17" font-weight="bold" fill="#0f172a">PostgreSQL 16</text>
  <text x="821" y="354" text-anchor="middle" font-size="13" fill="#1e293b">+ pgvector (HNSW)</text>
  <text x="821" y="376" text-anchor="middle" font-size="12" fill="#475569">conversations, orders, chunks,</text>
  <text x="821" y="394" text-anchor="middle" font-size="12" fill="#475569">audit log, LLM cost ledger</text>

  <!-- LLM providers -->
  <rect x="706" y="40" width="230" height="130" rx="10" fill="#faf5ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="821" y="68" text-anchor="middle" font-size="17" font-weight="bold" fill="#4c1d95">LLM providers</text>
  <rect x="722" y="80" width="198" height="34" rx="6" fill="#ffffff" stroke="#c4b5fd"/>
  <text x="821" y="102" text-anchor="middle" font-size="13" fill="#1e293b">Anthropic (primary)</text>
  <rect x="722" y="122" width="198" height="34" rx="6" fill="#ffffff" stroke="#c4b5fd"/>
  <text x="821" y="144" text-anchor="middle" font-size="13" fill="#1e293b">OpenAI (fallback, embeddings)</text>

  <!-- Langfuse -->
  <rect x="706" y="196" width="230" height="80" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="2"/>
  <text x="821" y="226" text-anchor="middle" font-size="17" font-weight="bold" fill="#78350f">Langfuse</text>
  <text x="821" y="248" text-anchor="middle" font-size="12" fill="#475569">traces, feedback scores,</text>
  <text x="821" y="264" text-anchor="middle" font-size="12" fill="#475569">cost and latency dashboard</text>

  <!-- Arrows -->
  <line x1="224" y1="225" x2="296" y2="225" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="260" y="215" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e293b">/api</text>
  <text x="260" y="246" text-anchor="middle" font-size="11" fill="#475569">JSON, SSE</text>

  <line x1="630" y1="110" x2="702" y2="110" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="666" y="100" text-anchor="middle" font-size="11" fill="#475569">HTTPS</text>

  <line x1="630" y1="236" x2="702" y2="236" stroke="#b45309" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow-dash)"/>
  <text x="666" y="226" text-anchor="middle" font-size="11" fill="#78350f">OTLP</text>

  <line x1="630" y1="355" x2="702" y2="355" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="666" y="345" text-anchor="middle" font-size="11" fill="#475569">SQL</text>
</svg>
